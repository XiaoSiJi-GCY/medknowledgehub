[project]
name = "medknowledgehub"
version = "1.0.0"
description = "Medical knowledge management and evidence-grounded Agentic RAG"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
 "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
 "pymilvus>=2.6.7,<2.7", "neo4j>=5.26,<6", "redis>=5,<7",
 "celery>=5.5,<6", "langgraph>=1,<2", "langchain-openai>=1,<2",
 "openai>=2,<4", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1",
 "pymupdf>=1.26,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
 "beautifulsoup4>=4.12,<5", "sqlglot>=26,<30", "streamlit>=1.50,<2",
 "mcp>=2,<3", "pyyaml>=6,<7", "prometheus-client>=0.21,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
observability = ["langfuse>=3,<4"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*", "scripts*", "evals*", "integrations*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["infrastructure: requires Docker services", "live: consumes configured model API"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
